<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATLAS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#fff;--bg2:#f5f5f7;--bg3:#eee;
  --fg:#1d1d1f;--fg2:#86868b;--fg3:#d2d2d7;
  --accent:#0071e3;--accent-h:#0077ed;
  --overlay:rgba(0,0,0,.35);
  --nav-h:48px;
  --thumb-w:220px;
  --side-w:240px;
}
[data-theme="dark"]{
  --bg:#000;--bg2:#111;--bg3:#1c1c1e;
  --fg:#f5f5f7;--fg2:#86868b;--fg3:#2d2d2f;
  --accent:#2997ff;--accent-h:#47a5ff;
  --overlay:rgba(0,0,0,.55);
}
html{scroll-behavior:auto;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow:hidden;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--fg);
  height:100%;overflow:hidden;
  transition:background .3s,color .3s;
}
::selection{background:var(--accent);color:#fff}
a{color:var(--accent);text-decoration:none;transition:color .2s}
a:hover{color:var(--accent-h)}
img{display:block;max-width:100%}
button{font-family:inherit}

/* ===== 顶栏 ===== */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  height:var(--nav-h);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;
  background:rgba(255,255,255,.72);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid rgba(0,0,0,.08);
  transition:background .3s,border-color .3s;
}
[data-theme="dark"] .nav{
  background:rgba(0,0,0,.72);
  border-bottom-color:rgba(255,255,255,.08);
}
.nav__logo{display:flex;align-items:center;height:24px}
.nav__logo img{height:100%;width:auto;display:block}
.nav__right{display:flex;align-items:center;gap:18px}
.nav__count{font-size:12px;color:var(--fg2)}
.theme-btn{
  background:none;border:none;cursor:pointer;
  color:var(--fg2);font-size:18px;padding:4px;line-height:1;
  transition:color .2s;display:flex;
}
.theme-btn:hover{color:var(--fg)}

/* ===== 主体三栏布局 ===== */
.app{
  display:flex;height:100vh;padding-top:var(--nav-h);
}

/* ===== 左侧缩略图条 ===== */
.strip{
  width:var(--thumb-w);flex-shrink:0;
  display:flex;flex-direction:column;
  overflow-y:auto;overflow-x:hidden;
  border-right:1px solid var(--fg3);
  scrollbar-width:none;
  padding:12px 0;
}
.strip::-webkit-scrollbar{display:none}

.strip-item{
  position:relative;
  margin:0 14px 14px;cursor:pointer;
  flex-shrink:0;
  transition:transform .25s ease;
}
.strip-item:hover{transform:scale(1.02)}
.strip-item:active{transform:scale(.98)}
.strip-item__img-wrap{
  position:relative;aspect-ratio:4/3;overflow:hidden;
  background:var(--bg2);border-radius:10px;
}
.strip-item__img{
  width:100%;height:100%;object-fit:cover;display:block;
}
.strip-item__overlay{
  position:absolute;inset:0;
  background:var(--overlay);border-radius:10px;
  transition:opacity .25s ease;pointer-events:none;
}
.strip-item.active .strip-item__overlay{opacity:0}
.strip-item.active::before{
  content:'';position:absolute;left:-14px;top:50%;transform:translateY(-50%);
  width:3px;height:40px;border-radius:0 2px 2px 0;
  background:var(--accent);
}
.strip-item__title{
  font-size:13px;font-weight:500;margin-top:8px;
  color:var(--fg2);padding:0 2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:color .25s;
}
.strip-item.active .strip-item__title{color:var(--fg);font-weight:600}
.strip-item__date{
  font-size:11px;color:var(--fg2);
  padding:0 2px;margin-top:2px;
  font-weight:500;letter-spacing:.02em;
  opacity:0;transition:opacity .25s;
}
.strip-item.active .strip-item__date{opacity:1}

/* ===== 中间展示区 ===== */
.viewer{
  flex:1;display:flex;flex-direction:column;
  overflow:hidden;min-width:0;
}
.viewer__inner{
  flex:1;display:flex;flex-direction:column;min-height:0;
}
.viewer__img-wrap{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:16px 24px;min-height:0;
}
.viewer__img{
  max-width:100%;max-height:100%;
  display:block;border-radius:10px;
}

/* ===== 右侧拓展栏 ===== */
.sidebar{
  width:var(--side-w);flex-shrink:0;
  border-left:1px solid var(--fg3);
  display:flex;flex-direction:column;
  padding:24px 20px;
  overflow-y:auto;
}
.sidebar__section{margin-bottom:24px}
.sidebar__title{
  font-size:20px;font-weight:700;
  letter-spacing:-.02em;line-height:1.25;
  padding-bottom:12px;margin-bottom:16px;
  border-bottom:1px solid var(--fg3);
}
.sidebar__title-meta{
  font-size:12px;color:var(--fg2);
  font-weight:500;margin-top:6px;
  display:flex;gap:12px;
}
.sidebar__label{
  font-size:10px;color:var(--fg2);
  letter-spacing:.12em;text-transform:uppercase;
  font-weight:600;margin-bottom:12px;
}
.sidebar__links{display:flex;flex-direction:column;gap:10px}
.sidebar__link{
  font-size:13px;font-weight:500;
  display:flex;align-items:center;gap:6px;
  padding:8px 0;border-bottom:1px solid var(--fg3);
  transition:gap .2s;
}
.sidebar__link:hover{gap:10px}
.sidebar__empty{
  font-size:12px;color:var(--fg3);
  font-style:italic;
}
.sidebar__info{
  font-size:11px;color:var(--fg2);
  line-height:1.6;
}
.sidebar__info-row{margin-bottom:6px}
.sidebar__desc{
  font-size:13px;color:var(--fg2);
  line-height:1.75;
}

.viewer__img-wrap,.sidebar{transition:opacity .3s ease}
.viewer.switching .viewer__img-wrap,
.app.switching .sidebar{opacity:0}

/* ===== 响应式 ===== */
@media(max-width:768px){
  :root{--thumb-w:120px;--side-w:0px}
  .nav__count{display:none}
  .viewer__img-wrap{padding:10px}
  .viewer__img{border-radius:6px}
  .strip-item__date{display:none}
  .strip-item__title{font-size:11px}
  .strip-item{margin:0 8px 10px}
  .sidebar{display:none}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav__logo"><img src="atlas-images/atlas-logo.svg" alt="ATLAS"></div>
  <div class="nav__right">
    <span class="nav__count" id="navCount"></span>
    <button class="theme-btn" id="themeToggle" aria-label="切换主题">☾</button>
  </div>
</nav>

<div class="app" id="app">
  <aside class="strip" id="strip"></aside>
  <main class="viewer" id="viewer">
    <div class="viewer__inner">
      <div class="viewer__img-wrap">
        <img class="viewer__img" id="viewerImg" src="" alt="">
      </div>
    </div>
  </main>
  <aside class="sidebar" id="sidebar"></aside>
</div>

<script>
const MONTHS = {'01':'Jan.','02':'Feb.','03':'Mar.','04':'Apr.','05':'May','06':'Jun.','07':'Jul.','08':'Aug.','09':'Sep.','10':'Oct.','11':'Nov.','12':'Dec.'};
function fmtDate(d){const[y,m]=d.split('.');return MONTHS[m]+' '+y;}

const shots = [
  {img:'atlas-images/tab_heyuan.jpg',name:'河源工厂',date:'2026.07',loc:'源城区西环路108号 农夫山泉河源工厂',desc:'参观农夫山泉河源工厂——万绿湖畔的工业水脉。',links:[{label:'万绿湖桨板',href:'wanlv-lake-paddle.html'},{label:'农夫配送',href:'factory-3d.html'}]},
  {img:'atlas-images/tab_ganzhou.jpg',name:'中书书院',date:'2026.07',loc:'章贡区仓背岭路 新旅中书书院酒店',desc:'下榻中书书院酒店——宋城古韵中的现代雅居。',links:[]},
  {img:'atlas-images/tab_chenzhou.jpg',name:'湖边野院',date:'2026.07',loc:'白廊镇石角头村 野小院',desc:'东江湖湖边——雾漫小东江，野院听水声。',links:[{label:'旅游笔记',href:'hubian-yeyuan.html'}]},
  {img:'atlas-images/tab_yangshuo.jpg',name:'清晖会馆',date:'2026.07',loc:'骥马村委铁岭81-1号 清晖会馆',desc:'甲天下桂林山水中的粤式雅致——遇龙河畔清晖夜。',links:[{label:'旅游笔记',href:'qinghui-huiguan.html'}]},
  {img:'atlas-images/tab_shanghai.jpg',name:'绿茵申花',date:'2026.05',loc:'徐汇区天钥桥路666号 上海体育场',desc:'观看"上海申花 VS 重庆铜梁龙"——虹口足球之夜。',links:[]},
  {img:'atlas-images/tab_huizhou.jpg',name:'荔浦风清',date:'2026.02',loc:'惠城区环城西二路17号 惠州宾馆',desc:'欣赏惠州西湖——岭南名郡，半城山色半城湖。',links:[]}
];

let cur=0;
const strip=document.getElementById('strip');
const viewerImg=document.getElementById('viewerImg');
const viewer=document.getElementById('viewer');
const sidebar=document.getElementById('sidebar');
const navCount=document.getElementById('navCount');
const app=document.getElementById('app');

// 渲染缩略图条
shots.forEach((s,i)=>{
  const el=document.createElement('div');
  el.className='strip-item'+(i===0?' active':'');
  el.dataset.idx=i;
  el.innerHTML=`
    <div class="strip-item__img-wrap">
      <img class="strip-item__img" src="${s.img}" alt="${s.name}" loading="lazy">
      <div class="strip-item__overlay"></div>
    </div>
    <div class="strip-item__title">${s.name}</div>
    <div class="strip-item__date">${fmtDate(s.date)}</div>`;
  el.addEventListener('click',()=>switchTo(i));
  strip.appendChild(el);
});

// 渲染右侧拓展栏
function renderSidebar(s){
  const linksHtml = s.links.length
    ? s.links.map(l=>`<a class="sidebar__link" href="${l.href}">${l.label} <span style="margin-left:auto;opacity:.4;font-size:12px">→</span></a>`).join('')
    : `<div class="sidebar__empty">暂无相关链接</div>`;
  const locShort = s.loc.includes(' ') ? s.loc.split(' ').slice(1).join(' ') : s.loc;
  sidebar.innerHTML=`
    <div class="sidebar__title">
      ${s.name}
      <div class="sidebar__title-meta">
        <span>${fmtDate(s.date)}</span>
        <span>${locShort}</span>
      </div>
    </div>
    <div class="sidebar__section">
      <div class="sidebar__label">Description</div>
      <p class="sidebar__desc">${s.desc}</p>
    </div>
    <div class="sidebar__section">
      <div class="sidebar__label">Quick Links</div>
      <div class="sidebar__links">${linksHtml}</div>
    </div>
    <div class="sidebar__section">
      <div class="sidebar__label">Info</div>
      <div class="sidebar__info">
        <div class="sidebar__info-row">${fmtDate(s.date)}</div>
        <div class="sidebar__info-row" style="line-height:1.5">${s.loc}</div>
      </div>
    </div>`;
}

let switching=false;
function switchTo(idx){
  if(idx<0||idx>=shots.length||idx===cur||switching)return;
  switching=true;
  const s=shots[idx];

  document.querySelectorAll('.strip-item').forEach((el,i)=>el.classList.toggle('active',i===idx));

  app.classList.add('switching');
  setTimeout(()=>{
    viewerImg.src=s.img;viewerImg.alt=s.name;
    renderSidebar(s);
    app.classList.remove('switching');
    switching=false;cur=idx;
    navCount.textContent=String(idx+1).padStart(2,'0')+' / '+String(shots.length).padStart(2,'0');
    sidebar.scrollTop=0;

    const activeEl=strip.children[idx];
    if(activeEl){
      const r=activeEl.getBoundingClientRect(),sr=strip.getBoundingClientRect();
      if(r.top<sr.top+16||r.bottom>sr.bottom-16)activeEl.scrollIntoView({behavior:'smooth',block:'center'});
    }
  },150);
}

// 初始化
const first=shots[0];
viewerImg.src=first.img;viewerImg.alt=first.name;
navCount.textContent='01 / '+String(shots.length).padStart(2,'0');
renderSidebar(first);

// 滚轮切换
let wheelLock=false;
function trySwitch(dir,e){
  if(wheelLock||switching)return false;
  const next=cur+dir;
  if(next<0||next>=shots.length)return false;
  if(e)e.preventDefault();
  wheelLock=true;switchTo(next);
  setTimeout(()=>{wheelLock=false},450);
  return true;
}
// 图片区滚轮直接切页
viewer.addEventListener('wheel',(e)=>{e.preventDefault();trySwitch(e.deltaY>0?1:-1);},{passive:false});
strip.addEventListener('wheel',(e)=>{e.preventDefault();trySwitch(e.deltaY>0?1:-1);},{passive:false});
// sidebar 边界时切页
sidebar.addEventListener('wheel',(e)=>{
  const atTop=sidebar.scrollTop<=0;
  const atBottom=sidebar.scrollTop+sidebar.clientHeight>=sidebar.scrollHeight-2;
  const dir=e.deltaY>0?1:-1;
  if((dir>0&&atBottom)||(dir<0&&atTop)){
    trySwitch(dir,e);
  }
},{passive:true});

// 键盘
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();if(!switching)switchTo(cur+1)}
  else if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();if(!switching)switchTo(cur-1)}
});

// 主题
const themeBtn=document.getElementById('themeToggle');
themeBtn.addEventListener('click',()=>{
  const html=document.documentElement;
  const dark=html.getAttribute('data-theme')==='dark';
  html.setAttribute('data-theme',dark?'light':'dark');
  themeBtn.textContent=dark?'☾':'☀';
});
</script>
</body>
</html>
