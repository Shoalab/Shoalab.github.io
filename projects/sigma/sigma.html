<style>
:root{
  --bg:#f4f3ef;
  --card:#e9e7e1;
  --card2:#dfddd6;
  --line:rgba(26,26,24,.12);
  --text:#1a1a18;
  --sub:#70706a;
  --sans:'Noto Sans SC',sans-serif;
  --serif:'Playfair Display','Noto Serif SC',serif;
  --mono:'JetBrains Mono',Consolas,monospace;
  --accent:#000091;
  --hand:'Caveat',cursive;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.75;overflow-x:hidden}
::selection{background:#1a1a18;color:#f4f3ef}

/* ========== 左右布局 ========== */
.layout{
  display:grid;
  grid-template-columns:minmax(340px,420px) 1fr;
  max-width:1500px;
  margin:0 auto;
  min-height:100vh;
}

/* ---- 左栏（sticky 固定） ---- */
.side{
  position:sticky;top:0;
  align-self:start;
  height:100vh;
  padding:42px 48px 36px;
  border-right:1px solid var(--line);
  overflow:hidden;
}
.brand{position:relative}
.brand__mark{
  width:58px;height:58px;border-radius:4px;
  background:#1a1a18;color:#f4f3ef;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-weight:700;font-size:24px;font-style:italic;
  margin-bottom:22px;
  box-shadow:0 10px 24px rgba(26,26,24,.14);
}
.brand__name{
  font-family:var(--serif);
  font-size:clamp(40px,3.8vw,54px);
  font-weight:700;line-height:1.05;
  letter-spacing:.01em;
}
.brand__name em{display:block;font-style:italic;color:#8a897f}
.brand__sub{
  font-size:15px;color:var(--sub);
  margin-top:10px;font-weight:500;
}
.brand__sub .hand{
  font-family:var(--hand);font-size:1.25em;color:#1a1a18;
  margin-left:6px;transform:rotate(-4deg);display:inline-block;
}

/* 页签指示器 */
.toc{display:flex;flex-direction:column;gap:1px;margin-top:24px}
.toc a{
  display:flex;align-items:center;gap:12px;
  text-decoration:none;color:var(--sub);
  font-size:13px;font-weight:500;
  padding:5px 12px;border-radius:6px;
  transition:.25s;border:1px solid transparent;
}
.toc a i{
  font-style:normal;font-family:var(--mono);font-size:11px;
  letter-spacing:.06em;
  color:var(--sub);opacity:.6;transition:.25s;min-width:20px;
}
.toc a em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc a:hover{color:var(--text);background:rgba(26,26,24,.05)}
.toc a.on{
  color:#000;background:#fff;
  border-color:rgba(26,26,24,.14);
  box-shadow:0 4px 14px rgba(26,26,24,.06);
  font-weight:700;
}
.toc a.on i{color:#000;opacity:.85}

/* ---- 右栏：滚动项目流 ---- */
.feed{
  padding:44px clamp(20px,3.6vw,56px) 56px;
  display:flex;flex-direction:column;gap:clamp(38px,5.5vh,64px);
}
.entry{
  background:var(--card);
  border:1px solid rgba(26,26,24,.07);
  border-radius:10px;
  padding:14px 14px 0;
  scroll-margin-top:20px;
  transition:box-shadow .35s;
}
.entry:hover{box-shadow:0 22px 48px rgba(26,26,24,.10)}
.entry__media{
  position:relative;aspect-ratio:16/9;
  overflow:hidden;border-radius:6px;
  background:var(--card2);
}
/* 大编号水印：mix-blend-mode 叠加，呼应 hermes 的图片混合手法 */
.entry__media::after{
  content:attr(data-num);
  position:absolute;right:10px;bottom:-18px;z-index:1;
  font-family:var(--mono);font-weight:700;font-size:92px;line-height:1;
  letter-spacing:-.04em;
  color:#fff;opacity:.32;mix-blend-mode:overlay;
  pointer-events:none;
}
.entry__media img{
  width:100%;height:100%;object-fit:cover;display:block;
  filter:blur(14px) saturate(.85);opacity:.35;transform:scale(1.07);
  transition:filter 1.1s cubic-bezier(.2,.7,.3,1),opacity 1.1s,transform 1.1s;
}
.entry.active .entry__media img{
  filter:blur(0) saturate(1);opacity:1;transform:scale(1);
  animation:kenburns 16s ease-in-out infinite alternate;
}
@keyframes kenburns{
  from{transform:scale(1)}
  to{transform:scale(1.06) translate(.8%,-.8%)}
}
/* 资料完善后把 <img> 换成
   <video src="xx.mp4" autoplay muted loop playsinline></video> 即为真动图 */
.entry__idx{
  position:absolute;top:14px;left:14px;z-index:2;
  font-family:var(--mono);font-style:normal;font-weight:500;font-size:12px;
  letter-spacing:.08em;
  color:#fff;background:rgba(26,26,24,.82);
  border-radius:2px;padding:4px 12px;
}
.entry__status{
  position:absolute;top:14px;right:14px;z-index:2;
  font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.08em;
  color:var(--accent);
  background:rgba(244,243,239,.94);
  border:1px solid rgba(26,26,24,.14);
  border-radius:2px;padding:3px 11px;
}
.entry__body{padding:22px 12px 26px}
.entry__meta{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.entry__tag{font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;color:var(--accent);font-weight:500}
.entry__name{
  font-family:var(--serif);
  font-size:clamp(26px,2.7vw,36px);font-weight:700;line-height:1.15;
}
.entry__name em{
  display:block;font-style:normal;
  font-family:var(--sans);font-weight:500;font-size:14px;
  color:var(--sub);letter-spacing:.03em;margin-top:7px;
}
.entry__desc{color:var(--sub);font-size:14.5px;margin-top:8px}
.entry__tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.tool-btn{
  display:inline-flex;align-items:center;gap:8px;
  text-decoration:none;font-family:var(--mono);font-size:12.5px;font-weight:600;letter-spacing:.05em;
  color:var(--text);background:#fff;
  border:1px solid rgba(26,26,24,.18);
  border-radius:5px;padding:9px 18px;transition:.22s;
}
.tool-btn i{font-style:normal;transition:transform .22s;color:var(--sub)}
.tool-btn:hover{background:#1a1a18;color:#f4f3ef;border-color:#1a1a18}
.tool-btn:hover i{transform:translateX(3px);color:#f4f3ef}

/* ==== Cartesius ViMow 俯视割草动画 ==== */
.mow{display:block;width:100%;height:100%;
  filter:blur(14px);opacity:.35;transform:scale(1.07);
  transition:filter 1.1s cubic-bezier(.2,.7,.3,1),opacity 1.1s,transform 1.1s}
.entry.active .mow{filter:none;opacity:1;transform:none}
.entry .mow .an{animation-play-state:paused}
.entry.active .mow .an{animation-play-state:running}
.mow-robot{animation:mowRobot 9s linear infinite}
.mow-trail{transform-box:fill-box;transform-origin:100% 50%;animation:mowTrail 9s linear infinite}
.mow-shake{transform-box:fill-box;transform-origin:center;animation:mowShake .5s ease-in-out infinite alternate}
.mow-spin{transform-box:fill-box;transform-origin:center;animation:mowSpin 4s linear infinite}
.mow-chip{animation:mowChip 1.1s linear infinite}
@keyframes mowRobot{
  0%  {opacity:1;transform:translate(1620px,340px);animation-timing-function:cubic-bezier(.22,.65,.16,1)}
  56% {opacity:1;transform:translate(430px,340px)}
  90% {opacity:1;transform:translate(430px,340px);animation-timing-function:ease-in}
  95% {opacity:0;transform:translate(430px,340px)}
  96% {opacity:0;transform:translate(1620px,340px);animation-timing-function:ease-out}
  100%{opacity:1;transform:translate(1620px,340px)}
}
@keyframes mowTrail{
  0%  {opacity:1;transform:scaleX(0);animation-timing-function:cubic-bezier(.22,.65,.16,1)}
  56% {opacity:1;transform:scaleX(1)}
  90% {opacity:1;transform:scaleX(1)}
  95% {opacity:0;transform:scaleX(1)}
  96% {opacity:0;transform:scaleX(0);animation-timing-function:linear}
  100%{opacity:1;transform:scaleX(0)}
}
@keyframes mowShake{from{transform:translateY(0) rotate(0deg)}to{transform:translateY(1.1px) rotate(.22deg)}}
@keyframes mowSpin{to{transform:rotate(360deg)}}
@keyframes mowChip{0%{transform:translate(0,0);opacity:0}18%{opacity:.85}100%{transform:translate(95px,-16px);opacity:0}}

/* ==== Hamuna 牛脸识别动画（手机取景器视角） ==== */
.cam-bg{transform-box:fill-box;transform-origin:center;animation:camDrift 11s ease-in-out infinite alternate}
@keyframes camDrift{from{transform:scale(1)}to{transform:scale(1.045) translate(-12px,9px)}}
.cam-rec{animation:camRec 1.3s linear infinite}
@keyframes camRec{0%,55%{opacity:1}56%,100%{opacity:.15}}
.cam-corners{transform-box:fill-box;transform-origin:center;animation:camCorners 9s ease-out infinite}
@keyframes camCorners{0%{opacity:0;transform:scale(1.5)}10%{opacity:1;transform:scale(1)}88%{opacity:1;transform:scale(1)}94%{opacity:0;transform:scale(1.08)}100%{opacity:0;transform:scale(1.5)}}
.cam-scan{transform-box:fill-box;animation:camScan 9s infinite}
@keyframes camScan{0%{opacity:0;transform:translateY(0);animation-timing-function:ease-in-out}3%{opacity:1;animation-timing-function:ease-in-out}16%{opacity:1;transform:translateY(272px);animation-timing-function:ease-in-out}32%{opacity:1;transform:translateY(0)}35%{opacity:0}100%{opacity:0;transform:translateY(0)}}
.cam-hint{animation:camHint 9s linear infinite}
@keyframes camHint{0%{opacity:0}3%{opacity:1}30%{opacity:1}34%{opacity:0}100%{opacity:0}}
.cam-badge{transform-box:fill-box;transform-origin:center;animation:camBadge 9s linear infinite}
@keyframes camBadge{0%{opacity:0;transform:scale(0)}36%{opacity:0;transform:scale(0);animation-timing-function:cubic-bezier(.34,1.56,.64,1)}42%{opacity:1;transform:scale(1.12)}45%{opacity:1;transform:scale(1)}88%{opacity:1;transform:scale(1);animation-timing-function:ease-in}93%{opacity:0;transform:scale(.55)}100%{opacity:0;transform:scale(0)}}
.cam-card{animation:camCard 9s linear infinite}
@keyframes camCard{0%{opacity:0;transform:translateY(130px)}40%{opacity:0;transform:translateY(130px);animation-timing-function:cubic-bezier(.2,.85,.3,1.05)}48%{opacity:1;transform:translateY(0)}88%{opacity:1;transform:translateY(0);animation-timing-function:ease-in}93%{opacity:0;transform:translateY(70px)}100%{opacity:0;transform:translateY(130px)}}
.cam-row{transform-box:fill-box;animation:camRow 9s linear infinite}
@keyframes camRow{0%{opacity:0;transform:translateX(-16px)}46%{opacity:0;transform:translateX(-16px)}52%{opacity:1;transform:translateX(0)}100%{opacity:1;transform:translateX(0)}}

/* 关于 & 联系 */
.block{
  background:#fff;
  border:1px solid rgba(26,26,24,.09);
  border-radius:10px;padding:clamp(24px,3.2vw,42px);
  scroll-margin-top:20px;
}
.block h3{font-family:var(--serif);font-size:clamp(22px,2.2vw,29px);font-weight:700;margin-bottom:12px}
.block h3 em{font-style:italic;font-weight:500;color:#8a897f}
.block p{color:var(--sub);font-size:14.5px}
.block p+p{margin-top:10px}
.block__row{display:flex;gap:11px;flex-wrap:wrap;margin-top:22px}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  text-decoration:none;font-weight:600;font-size:13px;
  font-family:var(--mono);letter-spacing:.08em;
  border-radius:4px;padding:12px 24px;transition:.25s;
}
.btn--dark{background:#1a1a18;color:#f4f3ef}
.btn--dark:hover{background:#000;transform:translateY(-2px)}
.btn--ghost{border:1px solid rgba(26,26,24,.16);color:var(--text);background:#fff}
.btn--ghost:hover{background:#1a1a18;color:#f4f3ef}

footer{border-top:1px solid var(--line);padding:30px 0 42px;text-align:center;color:var(--sub);font-size:13px}
footer .links{display:flex;gap:22px;justify-content:center;margin-bottom:8px;flex-wrap:wrap}
footer a{color:var(--sub);text-decoration:none;transition:.2s}
footer a:hover{color:#000}

/* 进场动画 */
.fade-up{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}
.fade-up.in{opacity:1;transform:none}

/* ========== 响应式 ========== */
@media (max-width:1020px){
  .layout{grid-template-columns:1fr}
  .side{
    position:relative;height:auto;
    border-right:none;border-bottom:1px solid var(--line);
    padding:42px clamp(20px,5vw,40px) 28px;
  }
  .toc{display:none}
  .side__stats{margin-top:18px}
  .feed{padding:36px clamp(14px,4vw,40px) 46px}
}

/* 懒加载 + 高清呈现：滚动检测，媒体进入视口 88% 线即呈现 */
const medias = [...document.querySelectorAll('.entry__media')];
const entries = [...document.querySelectorAll('.entry')];
function checkMedia(){
  medias.forEach(m=>{
    if(m.classList.contains('active')) return;
    const rc = m.getBoundingClientRect();
    if(rc.top < innerHeight * 0.88 && rc.bottom > 0){
      const img = m.querySelector('img');
      if(img && img.dataset.src){
        const base = img.dataset.src;
        let tries = 0;
        const load = ()=>{
          img.onload = ()=>{
            /* 生成接口偶发返回 1832×1832 “生成中”占位图：自动延时重试，最多 6 次 */
            if(img.naturalWidth === 1832 && tries < 6){
              tries++;
              setTimeout(load, 3500);
            }
          };
          /* 时间戳绕缓存：让接口重新执行生成流程 */
          img.src = base + (base.includes('?') ? '&' : '?') + 'r=' + Date.now();
        };
        load();
        delete img.dataset.src;
      }
      m.classList.add('active');
      /* active 同时标记到卡片根节点，供 .entry.active 系列样式（浮现/动画启动）使用 */
      const ent = m.closest('.entry');
      if(ent) ent.classList.add('active');
    }
  });
}
/* scrollspy：视口中线所在的项目 → 左栏页签高亮 */
function checkSpy(){
  let cur = null;
  entries.forEach(en=>{
    const rc = en.getBoundingClientRect();
    if(rc.top <= innerHeight * 0.5 && rc.bottom >= innerHeight * 0.5) cur = en.dataset.idx;
  });
  toc.querySelectorAll('a').forEach(a=>a.classList.toggle('on', a.dataset.idx === cur));
}
addEventListener('scroll', ()=>{ checkMedia(); checkSpy(); }, {passive:true});
addEventListener('resize', ()=>{ checkMedia(); checkSpy(); });
checkMedia(); checkSpy();
/* 轮询兜底：某些环境（后台标签/省电模式）scroll 事件可能被节流 */
setInterval(()=>{ checkMedia(); checkSpy(); }, 400);

/* 进场动画（IO + 滚动兜底） */
const io = new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
}),{threshold:.08});
document.querySelectorAll('.fade-up').forEach(el=>io.observe(el));
</script>
