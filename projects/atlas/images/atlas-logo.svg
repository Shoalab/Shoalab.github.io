    <!-- Arc/horizon underneath -->
    <path d="M0 54 Q38 18 76 54" stroke="url(#blue)" stroke-width="10" stroke-linecap="round" fill="none"/>
  </g>
  <!-- Thin separator -->
  <line x1="94" y1="14" x2="94" y2="50" stroke="currentColor" stroke-opacity="0.12" stroke-width="1.5"/>
  <!-- ΛTLΛS text -->
