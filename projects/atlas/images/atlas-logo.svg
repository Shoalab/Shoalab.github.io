<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 62" width="260" height="62">
  <defs>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2990F5;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1673D4;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <style>
    .logo-text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Segoe UI",sans-serif;font-weight:800;font-size:38px;letter-spacing:3px;}
  </style>
  <!-- Icon group -->
  <g transform="translate(4,4)">
