<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
var scene,camera,renderer,car,fw=[],rw=[];
var keys={},spd=0,rot=0,wrot=0,sang=0,started=true,obs=[];

function mkLogo(txt,w,h,fz){
  var cv=document.createElement("canvas");cv.width=w;cv.height=h;
  var cx=cv.getContext("2d");cx.fillStyle="#dd2222";cx.textAlign="center";cx.textBaseline="middle";
  cx.font="bold "+fz+"px Arial";cx.fillText(txt,w/2,h/2);
  return new THREE.CanvasTexture(cv);
}
var logoTex=mkLogo("农夫山泉",512,256,100);

var redM=new THREE.MeshStandardMaterial({color:0xdd2222});
var drkM=new THREE.MeshStandardMaterial({color:0x1a1a1a});

function mkWheel(){
  var g=new THREE.Group();
  var t=new THREE.Mesh(new THREE.CylinderGeometry(0.6,0.6,0.5,12),new THREE.MeshStandardMaterial({color:0x111}));
  t.rotation.z=Math.PI/2;g.add(t);return g;
}

function mkTruck(){
  var tr=new THREE.Group();var fW=[],rW=[];
  var ch=new THREE.Mesh(new THREE.BoxGeometry(2.4,0.5,9),drkM);ch.position.y=0.6;tr.add(ch);
  var cab=new THREE.Mesh(new THREE.BoxGeometry(2.3,2.5,2.5),redM);cab.position.set(0,2.0,2.8);tr.add(cab);
  var cg=new THREE.Mesh(new THREE.BoxGeometry(2.5,3.5,6),redM);cg.position.set(0,2.7,-2);tr.add(cg);
  var cnM=new THREE.MeshBasicMaterial({map:logoTex,transparent:true});
  for(var s=-1;s<=1;s+=2){var lg=new THREE.Mesh(new THREE.PlaneGeometry(1.2,2.5),cnM);lg.position.set(s*1.28,3,-2);lg.rotation.y=s*Math.PI/2;tr.add(lg);}
  var fp=[{x:1.2,z:3},{x:-1.2,z:3}];
  var rp2=[{x:1.2,z:-3},{x:-1.2,z:-3},{x:1.2,z:-4},{x:-1.2,z:-4}];
  fp.forEach(function(p){var pv=new THREE.Group();pv.position.set(p.x,0.6,p.z);tr.add(pv);var w=mkWheel();pv.add(w);fW.push({w:w,pv:pv});});
  rp2.forEach(function(p){var w=mkWheel();w.position.set(p.x,0.6,p.z);tr.add(w);rW.push(w);});
  return{m:tr,fw:fW,rw:rW};
}

scene=new THREE.Scene();scene.background=new THREE.Color(0x87CEEB);
scene.fog=new THREE.FogExp2(0x9dc4e0,0.004);
camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,500);camera.position.set(-70,15,-18);
renderer=new THREE.WebGLRenderer({canvas:document.getElementById("c"),antialias:true});
renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;
scene.add(new THREE.AmbientLight(0xffeedd,0.6));
var sun=new THREE.DirectionalLight(0xfff4e0,1.2);sun.position.set(60,100,60);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-150;sun.shadow.camera.right=150;sun.shadow.camera.top=150;sun.shadow.camera.bottom=-150;scene.add(sun);

// 地面
var ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshStandardMaterial({color:0x4a7c3f}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

// 道路系统
var mainRd=new THREE.Mesh(new THREE.PlaneGeometry(24,300),new THREE.MeshStandardMaterial({color:0x3a3a3a}));
mainRd.rotation.x=-Math.PI/2;mainRd.position.set(-70,0.01,0);scene.add(mainRd);
var rdLine=new THREE.Mesh(new THREE.PlaneGeometry(0.3,280),new THREE.MeshStandardMaterial({color:0xffff66}));
rdLine.rotation.x=-Math.PI/2;rdLine.position.set(-70,0.02,0);scene.add(rdLine);
// 厂区内部道路
var innerRd=new THREE.Mesh(new THREE.PlaneGeometry(14,120),new THREE.MeshStandardMaterial({color:0x3a3a3a}));
innerRd.rotation.x=-Math.PI/2;innerRd.position.set(20,0.01,0);scene.add(innerRd);
var parkRd=new THREE.Mesh(new THREE.PlaneGeometry(10,80),new THREE.MeshStandardMaterial({color:0x4a4a4a}));
parkRd.rotation.x=-Math.PI/2;parkRd.position.set(-35,0.01,-30);scene.add(parkRd);

// ====== 入口标志区（道路右侧） ======
var signX=-45;
// 入口广场地面
var plaza=new THREE.Mesh(new THREE.BoxGeometry(18,0.15,15),new THREE.MeshStandardMaterial({color:0xaaaaaa}));
plaza.position.set(signX,0.08,58);scene.add(plaza);
// 水池石砌边缘
var poolEdge=new THREE.Mesh(new THREE.BoxGeometry(26,0.6,14),new THREE.MeshStandardMaterial({color:0x888888}));
poolEdge.position.set(signX,0.3,58);scene.add(poolEdge);
// 喷泉水池底
var pool=new THREE.Mesh(new THREE.BoxGeometry(24,0.3,12),new THREE.MeshStandardMaterial({color:0x3d8bcc,transparent:true,opacity:0.8}));
pool.position.set(signX,0.15,58);scene.add(pool);
// 水面反光
var poolWater=new THREE.Mesh(new THREE.PlaneGeometry(22,10),new THREE.MeshPhongMaterial({color:0x5ca8d6,transparent:true,opacity:0.6,shininess:100}));
poolWater.rotation.x=-Math.PI/2;poolWater.position.set(signX,0.32,58);scene.add(poolWater);
// 红色"农夫山泉"立体字底座
var signBase=new THREE.Mesh(new THREE.BoxGeometry(10,1,2),new THREE.MeshStandardMaterial({color:0x666666}));
signBase.position.set(signX,0.5,58);scene.add(signBase);
// 文字贴图
var signCv=document.createElement("canvas");signCv.width=512;signCv.height=200;
var scx=signCv.getContext("2d");scx.fillStyle="#dd2222";scx.fillRect(0,0,512,200);
scx.fillStyle="#ffffff";scx.font="bold 80px Arial";scx.textAlign="center";scx.textBaseline="middle";
scx.fillText("农夫山泉",256,65);
scx.font="bold 36px Arial";scx.fillText("NONGFU SPRING",256,135);
var signTex=new THREE.CanvasTexture(signCv);
var signGeo=new THREE.BoxGeometry(9,2,0.6);
var signMat=new THREE.MeshStandardMaterial({map:signTex});
var sign=new THREE.Mesh(signGeo,signMat);
sign.position.set(signX,1.6,58);scene.add(sign);obs.push({x:signX,z:58,w:10,d:3});

// ====== 人工湖（厂房与入口之间，保持间距≥5米） ======
var lakeX=20;var lakeZ=40;
// 湖岸浅色石头，比湖大一圈）
var lakeBank=new THREE.Mesh(new THREE.BoxGeometry(28,0.4,20),new THREE.MeshStandardMaterial({color:0xaaaaaa}));
lakeBank.position.set(lakeX,0.2,lakeZ);scene.add(lakeBank);
// 湖底
var lakeBottom=new THREE.Mesh(new THREE.BoxGeometry(24,0.3,16),new THREE.MeshStandardMaterial({color:0x85c1e2}));

function hit(nx,nz){for(var i=0;i<obs.length;i++){var o=obs[i];if(Math.abs(nx-o.x)<o.w/2+1.5&&Math.abs(nz-o.z)<o.d/2+5)return true;}if(nx<-90||nx>90||nz<-90||nz>90)return true;return false;}

function loop(){
  requestAnimationFrame(loop);
  if(started){
    if(keys["w"])spd=Math.min(spd+0.008,0.5);
    else if(keys["s"])spd=Math.max(spd-0.008,-0.25);
    else spd*=0.98;
    if(keys["a"])sang=Math.min(sang+0.025,0.4);
    else if(keys["d"])sang=Math.max(sang-0.025,-0.4);
    else sang*=0.95;
    if(Math.abs(sang)>0.01&&Math.abs(spd)>0.01)rot+=spd/(6/Math.tan(sang));
    var mx=Math.sin(rot)*spd,mz=Math.cos(rot)*spd;
    if(!hit(car.position.x+mx,car.position.z))car.position.x+=mx;
    if(!hit(car.position.x,car.position.z+mz))car.position.z+=mz;
    car.rotation.y=rot;
    fw.forEach(function(f){f.pv.rotation.y=sang;});wrot+=spd*2;
    fw.forEach(function(f){f.w.rotation.x=wrot;});rw.forEach(function(w){w.rotation.x=wrot;});
    document.getElementById("sp").textContent=Math.abs(Math.round(spd*130));
    var dist=18,hgt=12;
    camera.position.x+=(car.position.x-Math.sin(rot)*dist-camera.position.x)*0.08;
    camera.position.y+=(hgt-camera.position.y)*0.05;
    camera.position.z+=(car.position.z-Math.cos(rot)*dist-camera.position.z)*0.08;
    camera.lookAt(car.position.x+Math.sin(rot)*2,car.position.y+2,car.position.z+Math.cos(rot)*2);
  }
  renderer.render(scene,camera);
}
loop();
