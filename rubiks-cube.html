<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 魔方 - 拖拽观赏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .title {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 8px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            z-index: 10;
            pointer-events: none;
        }

        .subtitle {
            position: absolute;
            top: 90px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 1rem;
            letter-spacing: 3px;
            z-index: 10;
            pointer-events: none;
        }

        .controls-hint {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            z-index: 10;
            pointer-events: none;
            display: flex;
            gap: 30px;
        }

        .hint-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hint-icon {
            width: 30px;
            height: 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .buttons {
            position: absolute;
            top: 30px;
            right: 30px;
            z-index: 10;
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <h1 class="title">RUBIK'S CUBE</h1>
    <p class="subtitle">拖拽旋转观赏 · 滚轮缩放</p>
    
    <div class="buttons">
        <button class="btn" id="scrambleBtn">打乱</button>
        <button class="btn" id="resetBtn">复位</button>
        <button class="btn" id="autoRotateBtn">自动旋转</button>
    </div>

    <div id="canvas-container"></div>

    <div class="controls-hint">
        <div class="hint-item">
            <div class="hint-icon">🖱</div>
            <span>拖拽旋转</span>
        </div>
        <div class="hint-item">
            <div class="hint-icon">🔍</div>
            <span>滚轮缩放</span>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, rubiksCube;
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let autoRotate = false;
        let targetRotation = { x: 0.3, y: -0.5 };
        let currentRotation = { x: 0.3, y: -0.5 };

        const colors = {
            white: 0xffffff,
            yellow: 0xffd500,
            red: 0xff0000,
            orange: 0xff8c00,
            blue: 0x0000ff,
            green: 0x00ff00
        };

        function init() {
            scene = new THREE.Scene();
            
            camera = new THREE.PerspectiveCamera(
                45,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.z = 8;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight1.position.set(5, 5, 5);
            directionalLight1.castShadow = true;
            scene.add(directionalLight1);

            const directionalLight2 = new THREE.DirectionalLight(0x4a90d9, 0.3);
            directionalLight2.position.set(-5, -3, -5);
            scene.add(directionalLight2);

            const pointLight = new THREE.PointLight(0xffffff, 0.5);
            pointLight.position.set(0, 0, 10);
            scene.add(pointLight);

            createRubiksCube();
            addEventListeners();
            animate();
        }

        function createRubiksCube() {
            rubiksCube = new THREE.Group();
            const cubeSize = 0.9;
            const gap = 0.05;
            const offset = (cubeSize + gap) * 1.5;

            for (let x = -1; x <= 1; x++) {
                for (let y = -1; y <= 1; y++) {
                    for (let z = -1; z <= 1; z++) {
                        const cubie = createCubie(cubeSize);
                        cubie.position.set(
                            x * (cubeSize + gap),
                            y * (cubeSize + gap),
                            z * (cubeSize + gap)
                        );
                        rubiksCube.add(cubie);
                    }
                }
            }

            rubiksCube.rotation.x = currentRotation.x;
            rubiksCube.rotation.y = currentRotation.y;
            scene.add(rubiksCube);
        }

        function createCubie(size) {
            const group = new THREE.Group();
            const geometry = new THREE.BoxGeometry(size, size, size);
            
            const materials = [
                new THREE.MeshPhongMaterial({ color: colors.green, shininess: 100 }),
                new THREE.MeshPhongMaterial({ color: colors.blue, shininess: 100 }),
                new THREE.MeshPhongMaterial({ color: colors.white, shininess: 100 }),
                new THREE.MeshPhongMaterial({ color: colors.yellow, shininess: 100 }),
                new THREE.MeshPhongMaterial({ color: colors.red, shininess: 100 }),
                new THREE.MeshPhongMaterial({ color: colors.orange, shininess: 100 })
            ];

            const mesh = new THREE.Mesh(geometry, materials);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            group.add(mesh);

            const edgesGeometry = new THREE.EdgesGeometry(geometry);
            const edgesMaterial = new THREE.LineBasicMaterial({ color: 0x111111, linewidth: 2 });
            const edges = new THREE.LineSegments(edgesGeometry, edgesMaterial);
            group.add(edges);

            const innerGeometry = new THREE.BoxGeometry(size * 0.98, size * 0.98, size * 0.98);
            const innerMaterial = new THREE.MeshPhongMaterial({ color: 0x1a1a1a });
            const innerMesh = new THREE.Mesh(innerGeometry, innerMaterial);
            group.add(innerMesh);

            return group;
        }

        function addEventListeners() {
            const canvas = renderer.domElement;

            canvas.addEventListener('mousedown', onMouseDown);
            canvas.addEventListener('mousemove', onMouseMove);
            canvas.addEventListener('mouseup', onMouseUp);
            canvas.addEventListener('mouseleave', onMouseUp);
            canvas.addEventListener('wheel', onWheel);

            canvas.addEventListener('touchstart', onTouchStart, { passive: false });
            canvas.addEventListener('touchmove', onTouchMove, { passive: false });
            canvas.addEventListener('touchend', onTouchEnd);

            window.addEventListener('resize', onWindowResize);

            document.getElementById('scrambleBtn').addEventListener('click', scrambleCube);
            document.getElementById('resetBtn').addEventListener('click', resetCube);
            document.getElementById('autoRotateBtn').addEventListener('click', toggleAutoRotate);
        }

        function onMouseDown(event) {
            isDragging = true;
            previousMousePosition = { x: event.clientX, y: event.clientY };
        }

        function onMouseMove(event) {
            if (!isDragging) return;

            const deltaMove = {
                x: event.clientX - previousMousePosition.x,
                y: event.clientY - previousMousePosition.y
            };

            targetRotation.y += deltaMove.x * 0.008;
            targetRotation.x += deltaMove.y * 0.008;
            targetRotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, targetRotation.x));

            previousMousePosition = { x: event.clientX, y: event.clientY };
        }

        function onMouseUp() {
            isDragging = false;
        }

        function onTouchStart(event) {
            event.preventDefault();
            if (event.touches.length === 1) {
                isDragging = true;
                previousMousePosition = { x: event.touches[0].clientX, y: event.touches[0].clientY };
            }
        }

        function onTouchMove(event) {
            event.preventDefault();
            if (!isDragging || event.touches.length !== 1) return;

            const deltaMove = {
                x: event.touches[0].clientX - previousMousePosition.x,
                y: event.touches[0].clientY - previousMousePosition.y
            };

            targetRotation.y += deltaMove.x * 0.008;
            targetRotation.x += deltaMove.y * 0.008;
            targetRotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, targetRotation.x));

            previousMousePosition = { x: event.touches[0].clientX, y: event.touches[0].clientY };
        }

        function onTouchEnd() {
            isDragging = false;
        }

        function onWheel(event) {
            camera.position.z += event.deltaY * 0.01;
            camera.position.z = Math.max(5, Math.min(15, camera.position.z));
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function scrambleCube() {
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const axis = Math.floor(Math.random() * 3);
                    const layer = Math.floor(Math.random() * 3) - 1;
                    const direction = Math.random() > 0.5 ? 1 : -1;
                    animateLayerRotation(axis, layer, direction * Math.PI / 2);
                }, i * 100);
            }
        }

        function animateLayerRotation(axis, layer, angle) {
            const cubies = [];
            const axisName = ['x', 'y', 'z'][axis];
            
            rubiksCube.children.forEach(cubie => {
                const pos = cubie.position[axisName];
                if (Math.abs(pos - layer * 0.95) < 0.5) {
                    cubies.push(cubie);
                }
            });

            const pivot = new THREE.Group();
            rubiksCube.add(pivot);
            cubies.forEach(cubie => pivot.attach(cubie));

            const start = { value: 0 };
            const end = { value: angle };
            const duration = 300;
            const startTime = Date.now();

            function animateRotation() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeProgress = 1 - Math.pow(1 - progress, 3);
                pivot.rotation[axisName] = start.value + (end.value - start.value) * easeProgress;

                if (progress < 1) {
                    requestAnimationFrame(animateRotation);
                } else {
                    cubies.forEach(cubie => rubiksCube.attach(cubie));
                    rubiksCube.remove(pivot);
                }
            }
            animateRotation();
        }

        function resetCube() {
            scene.remove(rubiksCube);
            targetRotation = { x: 0.3, y: -0.5 };
            currentRotation = { x: 0.3, y: -0.5 };
            camera.position.z = 8;
            createRubiksCube();
        }

        function toggleAutoRotate() {
            autoRotate = !autoRotate;
            document.getElementById('autoRotateBtn').textContent = autoRotate ? '停止旋转' : '自动旋转';
        }

        function animate() {
            requestAnimationFrame(animate);

            if (autoRotate && !isDragging) {
                targetRotation.y += 0.005;
            }

            currentRotation.x += (targetRotation.x - currentRotation.x) * 0.1;
            currentRotation.y += (targetRotation.y - currentRotation.y) * 0.1;

            if (rubiksCube) {
                rubiksCube.rotation.x = currentRotation.x;
                rubiksCube.rotation.y = currentRotation.y;
            }

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
