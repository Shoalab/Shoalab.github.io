<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORION · 工程项目</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Caveat:wght@600&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --lime:#c8f542;
  --ink:#101214;
  --bg:#0e1012;
  --panel:#17191c;
  --line:rgba(255,255,255,.10);
  --text:#eef1ee;
  --sub:#9aa39b;
  --sans:'Noto Sans SC',sans-serif;
  --disp:'Archivo Black','Noto Sans SC',sans-serif;
  --hand:'Caveat',cursive;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.7;overflow-x:hidden}
::selection{background:var(--lime);color:#000}

/* ========== 顶部胶囊导航 ========== */
.topbar{position:fixed;top:14px;left:0;right:0;z-index:100;display:flex;justify-content:center;padding:0 16px}
.topbar__pill{
  display:flex;align-items:center;gap:26px;
  background:rgba(16,18,20,.62);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.08);
  border-radius:999px;padding:8px 10px 8px 8px;
}
.topbar__logo{
  display:flex;align-items:center;gap:8px;
  background:var(--lime);color:#0c0e0a;
  font-weight:900;font-size:15px;letter-spacing:.5px;
  border-radius:999px;padding:8px 18px;
  text-decoration:none;white-space:nowrap;
}
.topbar__logo svg{width:17px;height:17px;flex:none}
.topbar__nav{display:flex;gap:4px}
.topbar__nav a{
  color:#d7dcd5;text-decoration:none;font-size:14.5px;font-weight:500;
  padding:7px 14px;border-radius:999px;transition:.25s;white-space:nowrap;
}
.topbar__nav a:hover{background:rgba(255,255,255,.10);color:#fff}
.topbar__cta{
  background:rgba(255,255,255,.94);color:#101214;text-decoration:none;
  font-size:14px;font-weight:700;border-radius:999px;padding:9px 20px;
  transition:.25s;white-space:nowrap;
}
.topbar__cta:hover{background:var(--lime)}

/* ========== HERO ========== */
.hero{position:relative;min-height:100vh;display:flex;align-items:center;overflow:hidden;isolation:isolate}
.hero__bg{
  position:absolute;inset:0;z-index:-3;
  background-image:url("https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=dark%20industrial%20robotics%20workshop%20at%20night%2C%20robotic%20arm%20assembling%20mechanical%20parts%20on%20workbench%2C%20green%20ambient%20lighting%20accents%2C%20sparks%20and%20tools%2C%20cinematic%20wide%20shot%2C%20photorealistic%2C%20moody%20atmosphere&image_size=landscape_16_9");
  background-size:cover;background-position:center 40%;
  animation:bgDrift 60s ease-in-out infinite alternate;
}
@keyframes bgDrift{from{transform:scale(1.06) translateX(-1.2%)}to{transform:scale(1.06) translateX(1.2%)}}
.hero__shade{
  position:absolute;inset:0;z-index:-2;
  background:linear-gradient(180deg,rgba(8,10,11,.55) 0%,rgba(8,10,11,.18) 34%,rgba(8,10,11,.10) 62%,rgba(14,16,18,.34) 84%,rgba(14,16,18,.52) 100%);
}
.hero__spot{
  position:absolute;z-index:-1;width:52vw;height:52vw;max-width:760px;max-height:760px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(200,245,66,.13),transparent 65%);
  filter:blur(10px);top:-12%;right:-8%;
  animation:spotFloat 14s ease-in-out infinite alternate;
}
@keyframes spotFloat{from{transform:translate(0,0)}to{transform:translate(-6vw,4vh)}}
/* 毛玻璃衔接层：背景图底部虚化融入深色区 */
.hero__glass{
  position:absolute;left:0;right:0;bottom:0;height:300px;z-index:3;
  background:linear-gradient(180deg,rgba(14,16,18,0) 0%,rgba(14,16,18,.30) 32%,rgba(14,16,18,.72) 66%,var(--bg) 94%);
  backdrop-filter:blur(22px) saturate(1.15);
  -webkit-backdrop-filter:blur(22px) saturate(1.15);
  -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 30%);
  mask-image:linear-gradient(180deg,transparent 0%,#000 30%);
}
.hero__inner{width:min(1180px,92%);margin:0 auto;padding:140px 0 320px}
.hero__title{
  font-family:var(--disp);font-size:clamp(56px,9vw,118px);line-height:.98;
  letter-spacing:.01em;color:var(--lime);
  text-shadow:0 4px 38px rgba(0,0,0,.45);
  position:relative;display:inline-block;
}
.hero__title .spark{
  position:absolute;color:var(--lime);
  filter:drop-shadow(0 0 12px rgba(200,245,66,.8));
  animation:twinkle 2.6s ease-in-out infinite;
}
.hero__title .spark--big{top:-14px;right:-44px;width:52px}
.hero__title .spark--small{top:44px;right:-70px;width:24px;animation-delay:1.3s}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1) rotate(0deg)}50%{opacity:.35;transform:scale(.72) rotate(18deg)}}
.hero__subtitle{
  font-family:var(--disp);font-size:clamp(38px,6vw,76px);line-height:1.02;
  color:#f4f6f2;position:relative;display:inline-block;margin-top:6px;
  text-shadow:0 4px 30px rgba(0,0,0,.45);
}
.hero__subtitle .hand{
  font-family:var(--hand);font-size:.44em;color:var(--lime);
  position:absolute;right:-.4em;bottom:-.18em;transform:rotate(-8deg);
  text-shadow:none;white-space:nowrap;
}
.hero__lead{margin-top:26px;font-size:clamp(16px,2vw,21px);color:#e6eae2;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.hero__lead span{display:block}
.hero__lead b{color:var(--lime);font-weight:700}

/* 底部倾斜卡片带（点击跳转） */
.rack{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);z-index:5;display:flex;gap:22px;width:max-content;padding:0 30px}
.rack__card{
  width:212px;height:150px;flex:none;
  border-radius:18px;border:4px solid rgba(255,255,255,.92);
  box-shadow:0 22px 44px rgba(0,0,0,.45);
  overflow:hidden;background:var(--panel);
  text-decoration:none;position:relative;
  transition:transform .35s cubic-bezier(.2,.9,.3,1.4),box-shadow .35s;
}
.rack__card img{width:100%;height:100%;object-fit:cover;display:block}
.rack__card i{
  position:absolute;left:10px;top:8px;font-style:normal;
  font-family:var(--disp);font-size:13px;
  background:rgba(10,12,10,.72);border:1px solid rgba(200,245,66,.6);color:var(--lime);
  border-radius:999px;padding:2px 10px;
}
.rack__card:nth-child(odd){transform:rotate(-5deg) translateY(14px)}
.rack__card:nth-child(even){transform:rotate(4deg) translateY(-6px)}
.rack__card:nth-child(3n){transform:rotate(-2deg) translateY(2px)}
.rack__card:hover{transform:rotate(0deg) translateY(-26px) scale(1.06);box-shadow:0 34px 60px rgba(0,0,0,.55),0 0 0 2px var(--lime);z-index:9}

/* ========== 项目总览 ========== */
.section{width:min(1180px,92%);margin:0 auto;padding:120px 0 40px}
.section__head{margin-bottom:44px}
.kicker{
  display:inline-flex;align-items:center;gap:8px;
  font-size:13px;font-weight:700;letter-spacing:.22em;color:var(--lime);
  border:1px solid rgba(200,245,66,.4);border-radius:999px;padding:5px 14px;margin-bottom:16px;
}
.kicker::before{content:'✦';font-size:11px}
.section__title{font-size:clamp(30px,4vw,46px);font-weight:900;line-height:1.15}
.section__sub{color:var(--sub);margin-top:10px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:22px}
.pj{
  background:var(--panel);border:1px solid var(--line);border-radius:20px;
  overflow:hidden;text-decoration:none;color:var(--text);
  display:flex;flex-direction:column;
  transition:transform .3s,border-color .3s,box-shadow .3s;
  opacity:0;transform:translateY(26px);
}
.pj.in{opacity:1;transform:none}
.pj:hover{transform:translateY(-6px);border-color:rgba(200,245,66,.55);box-shadow:0 24px 46px rgba(0,0,0,.4)}
.pj--soon{pointer-events:none}
.pj__thumb{position:relative;aspect-ratio:16/9;overflow:hidden}
.pj__thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.pj:hover .pj__thumb img{transform:scale(1.05)}
.pj__idx{
  position:absolute;top:12px;left:12px;
  font-family:var(--disp);font-size:13px;color:var(--lime);
  background:rgba(8,10,9,.74);border:1px solid rgba(200,245,66,.55);
  border-radius:999px;padding:3px 12px;
}
.pj__badge{position:absolute;top:12px;right:12px;font-size:12px;font-weight:700;color:#0b0d0a;background:var(--lime);border-radius:999px;padding:3px 12px}
.pj__body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:10px;flex:1}
.pj__venue{font-size:12.5px;letter-spacing:.14em;color:var(--sub);font-weight:600}
.pj__name{font-size:20px;font-weight:900;line-height:1.3}
.pj__name em{font-style:normal;color:var(--lime)}
.pj__desc{font-size:14.5px;color:var(--sub);flex:1}
.pj__foot{
  display:flex;align-items:center;justify-content:space-between;
  border-top:1px dashed var(--line);padding-top:14px;margin-top:4px;
  font-size:13px;color:var(--sub);
}
.pj__foot b{color:var(--text);font-weight:700}
.pj:hover .pj__foot b{color:var(--lime)}

footer{border-top:1px solid var(--line);padding:34px 0 44px;text-align:center;color:var(--sub);font-size:13.5px}
footer .links{display:flex;gap:22px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
footer a{color:var(--sub);text-decoration:none;transition:.2s}
footer a:hover{color:var(--lime)}

/* 进场动画 */
.fade-up{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease}
.fade-up.in{opacity:1;transform:none}

@media (max-width:860px){
  .topbar__pill{gap:8px}
  .topbar__nav{display:none}
  .hero__inner{padding:120px 0 300px}
  .rack{gap:14px;bottom:16px}
  .rack__card{width:150px;height:106px;border-width:3px}
}
@media (max-width:560px){
  .rack__card{width:118px;height:86px}
}
</style>
</head>
<body>

<!-- 顶部胶囊导航 -->
<header class="topbar">
  <div class="topbar__pill">
    <a class="topbar__logo" href="#top">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8L12 2z" fill="#0c0e0a"/></svg>
      ORION
    </a>
    <nav class="topbar__nav">
      <a href="#projects">项目总览</a>
    </nav>
    <a class="topbar__cta" href="../../index.html">返回主页</a>
  </div>
</header>

<!-- HERO -->
<section class="hero" id="top">
  <div class="hero__bg"></div>
  <div class="hero__shade"></div>
  <div class="hero__glass"></div>
  <div class="hero__spot"></div>

  <div class="hero__inner">
    <h1 class="hero__title">ORION
      <svg class="spark spark--big" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6L12 0z"/></svg>
      <svg class="spark spark--small" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6L12 0z"/></svg>
    </h1>
    <div class="hero__subtitle">WORKSHOP<span class="hand">Orion</span></div>
    <p class="hero__lead">
      <span>工程项目陈列：从灵蛇工程到正本固源</span>
      <span>把想法<b>做出来</b>、把问题<b>解决掉</b></span>
    </p>
  </div>

  <!-- 底部倾斜卡片带：点击跳转对应项目 -->
  <div class="rack" id="rack"></div>
</section>

<!-- 项目总览 -->
<section class="section" id="projects">
  <div class="section__head fade-up">
    <span class="kicker">PROJECTS</span>
    <h2 class="section__title">工程项目总览</h2>
    <p class="section__sub">点击卡片进入对应项目页查看完整拆解</p>
  </div>
  <div class="grid" id="grid"></div>
</section>

<footer>
  <div class="links">
    <a href="../../index.html">George Zhang · 主页</a>
    <a href="../atlas/atlas.html">ATLAS</a>
    <a href="../sigma/sigma.html">SIGMA</a>
    <a href="#top">ORION</a>
  </div>
  <div>© 2026 George Zhang · ORION Workshop</div>
</footer>

<script>
/* ===== 项目数据：与主页卡片一一对应，改这里即可 ===== */
const PROJECTS = [
  { idx:'01', name:'灵蛇工程',   en:'SNAKE',        badge:'G314',      badgeBg:'#00ff41', venue:'Jul. 2023', href:'snake/snake.html',
    desc:'正交关节模块化蛇形搜救机器人：蜿蜒步态模拟、四代样机演进与灾后废墟搜救实测。',
    img:'snake/assets/snake_gen3_hero.jpg' },
  { idx:'02', name:'膀检专家',   en:'BLADDER CHECK',badge:'丽湖商学院', badgeBg:'#1e90ff', venue:'Oct. 2022', href:'pjzj/pjzj.html',
    desc:'膀胱癌定量检测仪：基于微流控芯片与化学发光法的快速体外诊断设备研发及商业化。',
    img:'pjzj/assets/pang_1_hero.jpg' },
  { idx:'03', name:'包罗万象',   en:'BIONIC TRUNK', badge:'格物园',     badgeBg:'#95a5a6', venue:'Jun. 2022', href:'bionic-trunk/bionic-trunk.html',
    desc:'仿象鼻气动连续体机器人，利用气囊弹性变形实现大弯曲的柔性机械臂设计。',
    img:'bionic-trunk/assets/XB2.jpg' },
  { idx:'04', name:'正本固源',   en:'VIBRATION',    badge:'Fab Lab',    badgeBg:'#ffb800', venue:'May. 2023', href:'vibration/vibration.html',
    desc:'机械设备振动减轻和智能控制装置：弹簧+粘滞阻尼器+隔震支座三级减振体系，阻尼粒子碰撞耗能。',
    img:'vibration/assets/vib_hero.png' },
  { idx:'05', name:'PROJECT EPSILON', en:'AUTOMATION', badge:'COMPLETED', badgeBg:'#00ff41', venue:'AUTOMATION // 2024', href:'',
    desc:'搭建自动化测试框架，实现 CI/CD 流水线集成，提升测试效率 60%。',
    img:'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=automation%20testing%20framework%20with%20code%20editor%20and%20test%20runner%20green%20success%20indicators&image_size=landscape_4_3' },
  { idx:'06', name:'PROJECT ZETA', en:'UI/UX',     badge:'IN PROGRESS', badgeBg:'#fd79a8', venue:'UI/UX // 2025', href:'',
    desc:'用户体验测试与交互优化，收集真实用户反馈并迭代改进。',
    img:'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=game%20UI%20UX%20design%20review%20with%20mockups%20and%20prototypes%20on%20tablet%20professional&image_size=landscape_4_3' },
];

/* hero 底部卡片带：有详情页的跳详情，占位跳总览 */
const rack = document.getElementById('rack');
rack.innerHTML = PROJECTS.map(p=>`
  <a class="rack__card" href="${p.href || '#projects'}" title="${p.name}">
    <img src="${p.img}" alt="${p.name}">
    <i>${p.idx}</i>
  </a>`).join('');

/* 项目总览网格 */
const grid = document.getElementById('grid');
grid.innerHTML = PROJECTS.map(p=>`
  <a class="pj ${p.href ? '' : 'pj--soon'}" href="${p.href || 'javascript:void(0)'}" ${p.href ? '' : 'onclick="return false"'}>
    <div class="pj__thumb">
      <img src="${p.img}" alt="${p.name}" loading="lazy">
      <span class="pj__idx">NO.${p.idx}</span>
      <span class="pj__badge" style="background:${p.badgeBg}">${p.badge}</span>
    </div>
    <div class="pj__body">
      <div class="pj__venue">${p.venue}</div>
      <div class="pj__name">${p.name} <em>/${p.en}</em></div>
      <p class="pj__desc">${p.desc}</p>
      <div class="pj__foot"><span>${p.href ? '详情页' : '占位项目'}</span><b>${p.href ? '进入项目 →' : '敬请期待'}</b></div>
    </div>
  </a>`).join('');

/* 进场动画 */
const io = new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
}),{threshold:.12});
document.querySelectorAll('.fade-up,.pj').forEach((el,i)=>{
  if(el.classList.contains('pj')) el.style.transitionDelay = (i%3)*90+'ms';
  io.observe(el);
});
</script>
</body>
</html>
